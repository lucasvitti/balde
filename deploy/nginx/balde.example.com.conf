# VPS host nginx vhost for balde.example.com
# Balde de conhecimento (Knowledge pail) — governance cockpit.
#
# The WHOLE app is gated by Authentik forward-auth via the embedded outpost
# (127.0.0.1:8100), cloned from the velas-de-oracao / survey vhosts.
# App container publishes on 127.0.0.1:8098.
#
# HTTP-only block; run `certbot --nginx -d balde.example.com` AFTER
# this is live to add the TLS 443 listener + http->https redirect.
#
# HARDENING (applied on the VPS — see deploy/RUNBOOK-hardening.md):
#   1. Rate limiting: install deploy/nginx/conf.d-balde-ratelimit.conf into
#      /etc/nginx/conf.d/ (defines the balde_api zone used by location /api/v1/).
#   2. HSTS: in the certbot-managed 443 server block, add
#        add_header Strict-Transport-Security "max-age=63072000" always;
#      (add `; includeSubDomains` only if EVERY *.example.com is HTTPS).
#
# EMERGENCY BYPASS: if Authentik is down, comment out the `auth_request` and
# `error_page 401` lines in `location /` and `nginx -s reload`. (The app's own
# mock login remains as an inner layer.)

server {
    server_name balde.example.com;

    access_log /var/log/nginx/balde-access.log;
    error_log  /var/log/nginx/balde-error.log;

    client_max_body_size 5m;

    # ---- Authentik forward-auth (embedded outpost @ 127.0.0.1:8100) ----

    # Internal endpoint nginx calls to check the session.
    location = /outpost.goauthentik.io/auth/nginx {
        internal;
        proxy_pass              http://127.0.0.1:8100/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Host $http_host;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Real-IP $remote_addr;
    }

    # Public outpost paths (login / callback / sign-out).
    location ^~ /outpost.goauthentik.io {
        proxy_pass              http://127.0.0.1:8100/outpost.goauthentik.io;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Host $http_host;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Real-IP $remote_addr;
        add_header              Set-Cookie $auth_cookie;
        auth_request_set        $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    # 401 handler: send the browser to Authentik to sign in.
    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }

    # ---- Machine API: key-auth in the app, NOT behind Authentik ----
    # Services/agents consult the OKF corpus here with Authorization: Bearer <key>.
    location /api/v1/ {
        # Rate limit (needs limit_req_zone from conf.d-balde-ratelimit.conf).
        # 10 r/s per IP, burst 20 nodelay -> normal agent bursts pass, floods -> 429.
        limit_req        zone=balde_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Whole app behind Authentik ----
    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;

        # Pass the authenticated identity to the app (phase-2: app can read these
        # to drop its own mock login). Harmless today — the app ignores them.
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        auth_request_set $authentik_name     $upstream_http_x_authentik_name;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        proxy_set_header X-Authentik-Username $authentik_username;
        proxy_set_header X-Authentik-Email    $authentik_email;
        proxy_set_header X-Authentik-Name     $authentik_name;
        proxy_set_header X-Authentik-Groups   $authentik_groups;

        proxy_pass         http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
