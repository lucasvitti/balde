<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balde de conhecimento | Governança de Skills</title>
    <link rel="icon" type="image/svg+xml" href="/assets/balde-seal.svg?v=20260824">
    <link rel="shortcut icon" href="/assets/balde-seal.svg?v=20260824">
    <script>
      // Apply the saved theme before CSS loads so there is no flash of the wrong
      // theme. Mirrors the client's logic; the profile reconciles once app.js runs.
      (function () {
        try {
          var mode = localStorage.getItem('balde.theme') || 'light';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <!-- Vendored graph engine (Grafo view) — pinned local files, see /vendor/README.md.
         Classic scripts run before the app.js module, so the globals are ready. -->
    <script src="/vendor/layout-base.js"></script>
    <script src="/vendor/cose-base.js"></script>
    <script src="/vendor/cytoscape.min.js"></script>
    <script src="/vendor/cytoscape-fcose.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
